[package]
name = "worldfn"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A minimal Bevy-inspired typed function runtime for AI agents"
license = "MIT OR Apache-2.0"

[workspace]
members = [".", "worldfn-axum"]

[features]
default = ["structured"]
# `Llm::complete_as::<T>()`: typed replies validated by deserialization, with
# the JSON Schema generated from `T`.
structured = ["dep:serde", "dep:serde_json", "dep:schemars"]
# `CodexLlm`: calls the ChatGPT Codex backend with credentials written by the
# official Codex CLI (`codex login`). Unofficial for third-party use; see
# docs/providers.md before enabling.
codex = ["http", "dep:base64"]
# worldfn's own ChatGPT login for `CodexLlm` (browser PKCE or device code),
# with token refresh, plus the `worldfn login codex` binary. Same caveats.
codex-login = ["codex", "dep:sha2", "dep:getrandom", "dep:tokio"]
# `OpenAiCompatLlm`: any OpenAI-compatible Chat Completions API
# (OpenAI, DeepSeek, local servers) with an API key.
openai-compat = ["http"]
http = ["dep:reqwest", "dep:serde_json"]

[dependencies]
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.3", optional = true }
schemars = { version = "1", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "http2"] }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
# Already in the tree through reqwest; the login needs its listener and timers.
tokio = { version = "1", optional = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
base64 = "0.22"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util"] }


[[bin]]
name = "worldfn"
path = "src/bin/worldfn.rs"
required-features = ["codex-login"]

[[example]]
name = "live"
required-features = ["http"]

[[example]]
name = "triage"
test = true
required-features = ["structured"]

[[example]]
name = "mentor_tools"
required-features = ["structured"]
